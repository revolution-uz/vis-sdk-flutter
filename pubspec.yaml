name: vis_sdk
description: "Flutter plugin for Vis identity verification: document capture, liveness selfie and attested upload, wrapping the native Vis Android and iOS SDKs."
version: 1.0.1
homepage: https://vis.uz
repository: https://github.com/revolution-uz/vis-sdk-flutter
issue_tracker: https://github.com/revolution-uz/vis-sdk-flutter/issues
topics: [kyc, identity-verification, liveness, document-scanning]

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: uz.vis.sdk.flutter
        pluginClass: VisSdkPlugin
      ios:
        pluginClass: VisSdkPlugin
